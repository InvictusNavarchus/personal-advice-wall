<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Advice Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="wall-container">
    <header class="header">
      <div>
        <h1>Personal Advice Wall</h1>
        <p style="opacity:0.6; font-size:13px; margin-top:4px">Whispers of wisdom for the quiet hours.</p>
      </div>
      <div id="collection-count" style="font-size:12px; text-transform:uppercase; letter-spacing:1px; opacity:0.5">0 Reflections Collected</div>
    </header>
    <div id="wall" class="wall"></div>
  </div>

  <button id="fab" class="fab" aria-label="Add Advice">+</button>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">New Entry</h2>
      <textarea id="advice-input" placeholder="Write your thought here..."></textarea>
      <div class="modal-actions">
        <span class="keyboard-hint">Ctrl + Enter to save</span>
        <button id="cancel-btn" class="btn btn-cancel">Cancel</button>
        <button id="save-btn" class="btn btn-save">Save</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
