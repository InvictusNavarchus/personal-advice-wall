<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Advice Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #1a1816;
      --text-modal: #2d2a26;
      --text-main: #fdf8e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .wall-container {
      padding: 2.5rem;
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .header {
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(253, 248, 225, 0.1);
      padding-bottom: 16px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin: 0;
      font-style: italic;
      color: var(--text-main);
      font-weight: 700;
    }

    .wall {
      column-count: 1;
      column-gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .wall { column-count: 2; }
      .wall-container { padding: 3rem; }
    }

    @media (min-width: 1200px) {
      .wall { column-count: 4; }
    }

    .card {
      break-inside: avoid;
      margin-bottom: 20px;
      padding: 24px;
      border-radius: 4px;
      position: relative;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      color: var(--text-modal);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    }

    .text {
      font-family: 'Playfair Display', serif;
      line-height: 1.2;
      word-wrap: break-word;
      white-space: pre-wrap;
      margin: 0;
    }

    .actions {
      position: absolute;
      top: 10px;
      right: 10px;
      opacity: 0.3;
      display: flex;
      gap: 8px;
      transition: opacity 0.2s ease;
    }

    @media (hover: hover) {
      .card:hover .actions { opacity: 1; }
    }
    @media (hover: none) {
      .actions { opacity: 1; }
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.05);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-modal);
      transition: background 0.2s, color 0.2s;
      font-size: 12px;
    }

    .icon-btn:hover { background: rgba(0, 0, 0, 0.1); color: #000; }
    .icon-btn.delete:hover { background: rgba(220, 38, 38, 0.15); color: #dc2626; }

    .icon-svg {
      width: 16px; height: 16px;
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .fab {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #fdf8e1;
      color: #1a1816;
      border: none;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 100;
    }

    .fab:hover {
      transform: scale(1.05);
      background-color: #ffffff;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(20, 18, 16, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal {
      background: #fdf8e1;
      border-radius: 4px;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: transform 0.2s ease;
      margin: 1rem;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h2 {
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: #666;
      margin-bottom: 1rem;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 1rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--text-modal);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 4px;
      background: #fffdf5;
      resize: vertical;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      transition: border-color 0.2s;
    }

    textarea::placeholder {
      color: #bfaea0;
    }

    textarea:focus { border-color: #a8947a; }

    .modal-actions {
      margin-top: 1.5rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem;
    }

    .keyboard-hint {
      margin-right: auto;
      font-size: 0.85rem;
      color: #888;
    }

    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 0.6rem 1.25rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }

    .btn-cancel { background: transparent; color: #666; }
    .btn-cancel:hover { background: #ece8e1; color: #111; }
    .btn-save { background: #1e1b18; color: #fdfbf7; }
    .btn-save:hover { background: #3a3630; }

    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 50vh;
      color: #a8947a;
      text-align: center;
      font-family: 'Playfair Display', serif;
    }

    .empty-state h1 {
      font-size: 2.5rem;
      font-weight: 400;
      margin-bottom: 1rem;
    }
    
    .empty-state p {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="wall-container">
    <header class="header">
      <div>
        <h1>Personal Advice Wall</h1>
        <p style="opacity:0.6; font-size:13px; margin-top:4px">Whispers of wisdom for the quiet hours.</p>
      </div>
      <div id="collection-count" style="font-size:12px; text-transform:uppercase; letter-spacing:1px; opacity:0.5">0 Reflections Collected</div>
    </header>
    <div id="wall" class="wall"></div>
  </div>

  <button id="fab" class="fab" aria-label="Add Advice">+</button>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">New Entry</h2>
      <textarea id="advice-input" placeholder="Write your thought here..."></textarea>
      <div class="modal-actions">
        <span class="keyboard-hint">Ctrl + Enter to save</span>
        <button id="cancel-btn" class="btn btn-cancel">Cancel</button>
        <button id="save-btn" class="btn btn-save">Save</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      let advices = [];
      try {
        const stored = localStorage.getItem('advices_v1');
        if (stored) advices = JSON.parse(stored);
      } catch (e) {
        console.error("Failed to read from localStorage", e);
      }

      let editingId = null;

      const wall = document.getElementById('wall');
      const modalOverlay = document.getElementById('modal-overlay');
      const modalTitle = document.getElementById('modal-title');
      const adviceInput = document.getElementById('advice-input');
      const saveBtn = document.getElementById('save-btn');
      const cancelBtn = document.getElementById('cancel-btn');
      const fab = document.getElementById('fab');

      const cardColors = [
        '#fdf8e1',
        '#f9f1d0',
        '#fefce8'
      ];

      function getColor(id) {
        let hash = 0;
        for (let i = 0; i < id.length; i++) {
          hash = ((hash << 5) - hash) + id.charCodeAt(i);
          hash |= 0; 
        }
        return cardColors[Math.abs(hash) % cardColors.length];
      }

      function getFontOptions(text) {
        const len = text.trim().length;
        if (len < 50) return { size: 1.8, weight: 700 };
        if (len < 100) return { size: 1.4, weight: 600 };
        if (len < 180) return { size: 1.1, weight: 600 };
        return { size: 0.95, weight: 400 };
      }

      function escapeHTML(str) {
        const p = document.createElement('p');
        p.appendChild(document.createTextNode(str));
        return p.innerHTML;
      }

      const icons = {
        edit: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>`,
        trash: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
      };

      const collectionCountEl = document.getElementById('collection-count');

      function render() {
        wall.innerHTML = '';
        if (collectionCountEl) {
          collectionCountEl.textContent = `${advices.length} Reflection${advices.length !== 1 ? 's' : ''} Collected`;
        }

        if (advices.length === 0) {
          wall.style.columnCount = '1';
          wall.innerHTML = `
            <div class="empty-state">
              <h1>A Blank Canvas</h1>
              <p>Click the + button to add your first piece of advice.</p>
            </div>
          `;
          return;
        }

        wall.style.columnCount = '';

        advices.forEach(advice => {
          const card = document.createElement('div');
          card.className = 'card';
          card.style.backgroundColor = getColor(advice.id);

          const textEl = document.createElement('div');
          textEl.className = 'text';
          const opts = getFontOptions(advice.text);
          textEl.style.fontSize = opts.size + 'rem';
          textEl.style.fontWeight = opts.weight;
          textEl.innerHTML = escapeHTML(advice.text);

          const actions = document.createElement('div');
          actions.className = 'actions';

          const editBtn = document.createElement('button');
          editBtn.className = 'icon-btn';
          editBtn.innerHTML = icons.edit;
          editBtn.title = 'Edit';
          editBtn.onclick = () => openModal(advice.id);

          const delBtn = document.createElement('button');
          delBtn.className = 'icon-btn delete';
          delBtn.innerHTML = icons.trash;
          delBtn.title = 'Double-click to delete';
          delBtn.ondblclick = () => {
            advices = advices.filter(a => a.id !== advice.id);
            saveAndRender();
          };

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          card.appendChild(textEl);
          card.appendChild(actions);
          wall.appendChild(card);
        });
      }

      function saveAndRender() {
        try {
          localStorage.setItem('advices_v1', JSON.stringify(advices));
        } catch(e) {
          console.error('Failed to save', e);
        }
        render();
      }

      function openModal(id = null) {
        editingId = id;
        if (id) {
          const ad = advices.find(a => a.id === id);
          adviceInput.value = ad ? ad.text : '';
          modalTitle.textContent = 'Edit Entry';
        } else {
          adviceInput.value = '';
          modalTitle.textContent = 'New Entry';
        }
        modalOverlay.classList.add('active');
        
        requestAnimationFrame(() => {
          adviceInput.focus();
          adviceInput.selectionStart = adviceInput.selectionEnd = adviceInput.value.length;
        });
      }

      function closeModal() {
        modalOverlay.classList.remove('active');
        editingId = null;
        adviceInput.value = '';
        adviceInput.blur();
      }

      function saveAdvice() {
        const text = adviceInput.value.trim();
        if (!text) return;

        if (editingId) {
          const index = advices.findIndex(a => a.id === editingId);
          if (index !== -1) {
            advices[index].text = text;
          }
        } else {
          advices.push({
            id: Date.now().toString() + Math.random().toString(36).substring(2, 7),
            text: text,
            createdAt: Date.now()
          });
        }
        closeModal();
        saveAndRender();
      }

      fab.onclick = () => openModal();
      cancelBtn.onclick = closeModal;
      saveBtn.onclick = saveAdvice;

      modalOverlay.onmousedown = (e) => {
        if (e.target === modalOverlay) closeModal();
      };

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
          closeModal();
        }
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && modalOverlay.classList.contains('active')) {
          saveAdvice();
        }
      });

      render();
    })();
  </script>
</body>
</html>
